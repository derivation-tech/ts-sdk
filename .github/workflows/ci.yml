name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Locate Node 18 consumer runtime
        id: node18
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/viem-ledger run build
      - run: pnpm -C packages/viem-kit run verify
      - name: Install minimum supported viem
        shell: bash
        run: |
          minimum="$(node <<'NODE'
          const range = require('./packages/viem-kit/package.json').peerDependencies.viem;
          if (!/^\^\d+\.\d+\.\d+$/.test(range)) throw new Error('Expected an exact caret viem peer range');
          console.log(range.slice(1));
          NODE
          )"
          npm install --prefix "$RUNNER_TEMP/viem-minimum" --ignore-scripts --no-audit --no-fund "viem@$minimum"
      - name: Verify minimum viem consumer
        run: pnpm -C packages/viem-kit run verify:consumer "$RUNNER_TEMP/viem-minimum/node_modules/viem"
      - name: Verify Node 18 consumers
        env:
          NODE18: ${{ steps.node18.outputs.path }}
        run: |
          "$NODE18" packages/viem-kit/scripts/verify-consumer.mjs
          "$NODE18" packages/viem-kit/scripts/verify-consumer.mjs "$RUNNER_TEMP/viem-minimum/node_modules/viem"
