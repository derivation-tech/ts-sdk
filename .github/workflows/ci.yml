name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: pnpm -C packages/viem-kit run test:anvil

  # Packed-consumer checks across the supported Node range and the locked/minimum viem peer.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        viem: [locked, minimum]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install minimum supported viem
        if: matrix.viem == 'minimum'
        shell: bash
        run: |
          for package in viem-kit viem-ledger; do
            range="$(jq -r '.peerDependencies.viem' "packages/$package/package.json")"
            [[ "$range" =~ ^\^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an exact caret viem peer range: $range"; exit 1; }
            npm install --prefix "$RUNNER_TEMP/$package" --ignore-scripts --no-audit --no-fund "viem@${range#^}"
          done
      - name: Verify packed consumers
        env:
          KIT_VIEM: ${{ matrix.viem == 'minimum' && format('{0}/viem-kit/node_modules/viem', runner.temp) || '' }}
          LEDGER_VIEM: ${{ matrix.viem == 'minimum' && format('{0}/viem-ledger/node_modules/viem', runner.temp) || '' }}
        run: |
          node packages/viem-kit/scripts/verify-consumer.mjs $KIT_VIEM
          node packages/viem-ledger/scripts/verify-compatibility.cjs $LEDGER_VIEM
