name: Changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm run verify
      - name: Configure publish registry
        env:
          NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
        run: node scripts/write-publish-config.cjs
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run release:version
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PNPM_CONFIG_NPMRC_AUTH_FILE: ${{ runner.temp }}/publish.npmrc
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
