name: Changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm run verify
      - name: Configure publish registry
        env:
          NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const registry = new URL(process.env.NPM_REGISTRY_URL);
          if (!['http:', 'https:'].includes(registry.protocol) || registry.username || registry.password || registry.search || registry.hash) {
            throw new Error('Expected a registry URL without credentials, query or fragment');
          }
          registry.pathname = registry.pathname.replace(/\/?$/, '/');
          const content = `@derivation-tech:registry=${registry.href}\n//${registry.host}${registry.pathname}:_authToken=\${NODE_AUTH_TOKEN}\n`;
          writeFileSync(join(process.env.RUNNER_TEMP, 'publish.npmrc'), content, { mode: 0o600 });
          NODE
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run release:version
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
